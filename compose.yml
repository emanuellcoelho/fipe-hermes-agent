# This project's name, said out loud rather than taken from the directory.
# Compose names the container and the home volume after the project, so a
# renamed or re-cloned checkout would otherwise create a second, empty
# `<dir>_agent-home` and the agent would wake up with no sessions, no
# memories and no crons -- with the real home still on disk under the old
# name. Pinning it keeps the home tied to the agent, not to the path.
name: fipe-hermes-agent

services:
  agent:
    build: .
    # What `plow-agents mint` wrote: where Plow is, and this agent's token. A
    # Plow cloud deploy publishes the same names into the container's own
    # environment, so a local run and a hosted one boot down the same path.
    env_file:
      - path: ./plow-credentials
        required: false
    # Which agent this is on the Agent Index. The reporter refuses to guess.
    # The image carries the same value as ENV -- the cloud has no compose to
    # read this from -- and this line is what a local run uses.
    environment:
      AGENT_ID: fipe
      # Professional scraping fallback (scraperapi.com) -- revives ESPN-style
      # JSON APIs this network cannot reach directly. Empty = disabled.
      SCRAPERAPI_KEY: ${SCRAPERAPI_KEY:-}
    volumes:
      # The agent's home, kept across `up`/`down` for its sessions, memory and
      # the watched vehicles. `docker compose down -v` starts this agent fresh.
      - agent-home:/var/lib/hermes
    # The agent checkpoints on SIGTERM; its supervisor allows 30s, and Docker's
    # default 10s cuts it off and orphans the transcript lease.
    stop_grace_period: 35s
    # The agent is idle 99% of the time -- crons a few times a day, one chat
    # turn now and then. The caps keep a runaway turn from starving the host;
    # 512m is what a settled gateway actually uses, with headroom.
    mem_limit: 512m
    cpus: 1.0
    # No ports: the agent connects to Plow outbound.

volumes:
  agent-home: